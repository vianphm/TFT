<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Blitz In-Game Overlay</title>
  <link rel="stylesheet" href="../shared/blitz.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body class="overlay-body">
  <!-- THANH HUD MINI TRÊN CÙNG -->
  <div class="hud-bar" id="hudBar" data-hit>
    <div class="hud-brand">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span>BLITZ HUD</span>
    </div>

    <div class="hud-round-badge" id="hudRoundBadge">Vòng 2-1</div>

    <div class="hud-divider"></div>

    <!-- CÁC NÚT BẬT TẮT WIDGET -->
    <button class="hud-btn active" id="toggleCompWidget" data-hit title="Bật/Tắt khung Đội Hình">Đội Hình</button>
    <button class="hud-btn active" id="toggleOddsWidget" data-hit title="Bật/Tắt khung Tỉ Lệ Roll">Tỉ Lệ</button>
    <button class="hud-btn" id="toggleItemsWidget" data-hit title="Bật/Tắt khung Ghép Đồ">Ghép Đồ</button>

    <div class="hud-divider"></div>

    <!-- NÚT ĐẾM GIỜ 30S -->
    <button class="hud-btn" id="btnTimer30" data-hit title="Đếm 30 giây chuẩn bị">
      <span id="timerText">⏱️ 30s</span>
    </button>

    <!-- NÚT KHÓA / MỞ XUYÊN CHUỘT -->
    <button class="hud-btn" id="btnLock" data-hit title="Bấm hoặc nhấn F3 để Khóa/Mở xuyên chuột">
      <span id="lockStatus">🔒 Xuyên Game (F3)</span>
    </button>

    <!-- NÚT ẨN OVERLAY -->
    <button class="hud-btn hud-btn-close" id="btnCloseOverlay" data-hit title="Ẩn Overlay (Nhấn F2 để hiện lại)">✕</button>
  </div>

  <!-- WIDGET 1: ĐỘI HÌNH ĐANG GHIM (PINNED COMP) -->
  <div class="widget" id="widgetComp" data-hit style="top: 60px; left: 20px;">
    <div class="widget-header">
      <div class="widget-title">
        <span>★ Đội Hình Mục Tiêu</span>
        <span class="widget-tier-badge" id="overlayCompTier">S</span>
      </div>
      <span class="widget-drag-handle" title="Kéo thả để di chuyển">⠿</span>
    </div>
    <div class="widget-body">
      <div class="widget-comp-name" id="overlayCompName">Đang tải đội hình...</div>
      <div class="widget-units-list" id="overlayUnitsList">
        <!-- Rendered by overlay.js -->
      </div>
    </div>
  </div>

  <!-- WIDGET 2: TỈ LỆ ROLL THEO CẤP -->
  <div class="widget" id="widgetOdds" data-hit style="bottom: 20px; left: 20px;">
    <div class="widget-header">
      <div class="widget-title">
        <span>🎲 Tỉ Lệ Roll Cửa Hàng (Cấp <span id="overlayCurrentLevel">8</span>)</span>
      </div>
      <span class="widget-drag-handle" title="Kéo thả để di chuyển">⠿</span>
    </div>
    <div class="widget-body">
      <div class="overlay-odds-grid" id="overlayOddsGrid">
        <!-- Rendered by overlay.js -->
      </div>
    </div>
  </div>

  <!-- WIDGET 3: TRA CỨU ĐỒ GHÉP NHANH -->
  <div class="widget hidden" id="widgetItems" data-hit style="top: 60px; right: 20px;">
    <div class="widget-header">
      <div class="widget-title">
        <span>⚔️ Bảng Ghép Đồ Nhanh</span>
      </div>
      <span class="widget-drag-handle" title="Kéo thả để di chuyển">⠿</span>
    </div>
    <div class="widget-body" style="max-height: 360px; overflow-y: auto;">
      <div class="overlay-items-list" id="overlayItemsList">
        <!-- Rendered by overlay.js -->
      </div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
