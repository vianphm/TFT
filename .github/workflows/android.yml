name: Build APK Android

# Dong goi app Android (bong bong noi de len game) va dua APK len phan Artifacts
# de tai ve dien thoai. Chay tu dong khi doi code trong android/ hoac src/mobile/,
# hoac bam tay o tab Actions.
on:
  push:
    paths:
      - 'android/**'
      - 'src/mobile/**'
      - 'src/renderer/shared/**'
      - 'test/**'
      - 'scripts/build-mobile.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kiem thu phan tinh toan
        run: node test/calc.test.js && node test/analyzer.test.js

      - name: Gom ban web vao assets cua app
        run: node scripts/build-mobile.js android/app/src/main/assets/mobile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK (ban debug)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Dat ten file APK theo ngay va commit
        id: apk
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/tft-companion-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"
          echo "path=$(ls out/*.apk)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: tft-companion-apk
          path: out/*.apk
          if-no-files-found: error

      # Dua APK len muc Releases de tai thang tren dien thoai, khong can dang nhap
      - name: Cap nhat ban tai ve
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: TFT Companion - ban Android moi nhat
          body: |
            APK moi nhat, build tu dong tu nhanh `${{ github.ref_name }}` (commit ${{ github.sha }}).

            Tai file `.apk` ben duoi bang trinh duyet dien thoai roi mo ra de cai.
            Lan dau Android se hoi cho phep cai tu nguon nay - dong y la xong.
            Mo app, cap quyen "Hien thi tren ung dung khac", bam bat bong bong roi vao game.
          files: out/*.apk
          prerelease: true
          make_latest: false
